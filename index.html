<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nurmikon leikkipalvelu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf7ea;
      color: #183d18;
      text-align: center;
    }

    header {
      background: #2e8b57;
      color: white;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 10px;
    }

    .content {
      padding: 30px 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #2e8b57;
    }

    .button {
      display: inline-block;
      background: #2e8b57;
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 20px;
      margin-top: 10px;
    }

    footer {
      background: #183d18;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌱 Nurmikon leikkipalvelu</h1>
    <p>Siisti nurmikko helposti ja edullisesti!</p>
  </header>

  <div class="content">

    <div class="card">
      <h2>Nurmikon leikkuu</h2>
      <p>Leikkaamme nurmikon siistiksi ja nopeasti.</p>
      <p class="price">Edullisesti!</p>
      <a class="button" href="tel:+358451316905">📞 Ota yhteyttä</a>
    </div>

    <div class="card">
      <h2>Miksi valita meidät?</h2>
      <p>✅ Edullinen hinta</p>
      <p>✅ Huolellinen työnjälki</p>
      <p>✅ Ystävällinen palvelu</p>
    </div>

  </div>

  <footer>
    <p>📞 +358 45 131 6905</p>
    <p>Nurmikon leikkipalvelu</p>
  </footer>

</body>
</html>
